[project]
name = "ch11-agent-harnesses"
version = "0.1.0"
description = "Runnable code companion for the 'Agent Harnesses, with Deep Agents' chapter."
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents>=0.5.9",
    "langchain>=1.0.0,<2.0",
    "langchain-openai",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["models", "sources"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
